name: 03 — Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-test:
    name: Frontend Quality, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Verification (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint Code Quality
        working-directory: frontend
        run: npm run lint

      - name: Vitest Unit & Integration Suite
        working-directory: frontend
        run: npm run test:run

      - name: Vite Production Bundle Build
        working-directory: frontend
        run: npm run build

      - name: Archive Production Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
