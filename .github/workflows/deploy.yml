name: 05 — Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      skip_healthcheck:
        description: "Skip automated health check"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Staging Deployment
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy-frontend.outputs.staging_url || 'https://staging.stockrescue.internal' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL || 'https://api-staging.stockrescue.internal' }}
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend to Staging (Vercel / Hosting Provider)
        id: deploy-frontend
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Deploying to Vercel staging..."
            npx --yes vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} || true
          else
            echo "ℹ️ VERCEL_TOKEN not set; skipping live Vercel deploy step."
          fi

      - name: Trigger Backend Staging Deploy Webhook (Render / Cloud Host)
        run: |
          if [ -n "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" ]; then
            echo "Triggering backend deploy hook..."
            curl -fsSL -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
          else
            echo "ℹ️ Backend deploy hook not configured; ready for webhook attachment."
          fi

  # ---------------------------------------------------------------------------
  # 2. Automated Staging Health Check
  # ---------------------------------------------------------------------------
  staging-health-check:
    name: Staging Health Verification
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ !inputs.skip_healthcheck }}
    steps:
      - name: Validate Health Endpoint
        run: |
          if [ -n "${{ secrets.STAGING_HEALTH_URL }}" ]; then
            echo "Polling staging health check at ${{ secrets.STAGING_HEALTH_URL }}..."
            for i in {1..10}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_HEALTH_URL }}" || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Staging health check passed with HTTP 200!"
                exit 0
              fi
              echo "Waiting for staging warmup (attempt $i/10, status: $STATUS)..."
              sleep 6
            done
            echo "⚠️ Health check reached timeout; review staging logs."
          else
            echo "ℹ️ STAGING_HEALTH_URL secret not defined. Skipping automated poll."
          fi

  # ---------------------------------------------------------------------------
  # 3. Production Deployment (Requires Protected Environment Approval Gate)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging-health-check
    if: github.ref == 'refs/heads/main' || inputs.target_env == 'production'
    environment:
      name: production
      url: ${{ steps.deploy-prod.outputs.prod_url || 'https://stockrescue.internal' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Production Assets
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.PROD_VITE_API_URL || 'https://api.stockrescue.internal' }}
        run: |
          npm ci
          npm run build

      - name: Deploy Production Frontend
        id: deploy-prod
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "Deploying production release to Vercel..."
            npx --yes vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} || true
          else
            echo "ℹ️ VERCEL_TOKEN not set; skipping live production deploy step."
          fi

      - name: Trigger Backend Production Deploy Webhook
        run: |
          if [ -n "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}" ]; then
            echo "Triggering production deploy webhook..."
            curl -fsSL -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
          else
            echo "ℹ️ Production deploy hook not configured; ready for webhook attachment."
          fi

      - name: Production Deployment Audit Log
        run: |
          echo "🚀 Production release deployed from commit ${{ github.sha }} by ${{ github.actor }}"
