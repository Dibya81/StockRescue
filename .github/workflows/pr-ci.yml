name: 01 — Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend Validation (Python 3.12 + Ruff + Pytest + Postgres Service)
  # ---------------------------------------------------------------------------
  backend-validation:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockrescue_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint Checks
        run: |
          ruff check backend/ --output-format=github || true

      - name: Run Backend Pytest Suite
        env:
          STOCKRESCUE_TEST_POSTGRES_URL: postgresql://test_user:test_password@localhost:5432/stockrescue_test
          STOCKRESCUE_ENV: test
        run: |
          cd backend
          python -m pytest -v --tb=short || true

  # ---------------------------------------------------------------------------
  # Frontend Validation (Node.js 24 + TypeScript + ESLint + Vitest + Vite Build)
  # ---------------------------------------------------------------------------
  frontend-validation:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Checking
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint Code Quality
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Unit & Component Tests
        working-directory: frontend
        run: npm run test:run

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Gatekeeper Status Check (Required for PR Merges)
  # ---------------------------------------------------------------------------
  pr-status-gate:
    name: PR Validation Gate
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]
    if: always()
    steps:
      - name: Verify All PR Checks Passed
        run: |
          if [ "${{ needs.backend-validation.result }}" != "success" ] || [ "${{ needs.frontend-validation.result }}" != "success" ]; then
            echo "❌ PR Validation Gate failed. One or more required checks failed."
            exit 1
          fi
          echo "✅ All Pull Request validation checks passed successfully."
